[project]
name = "side-hustle"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mialy333", email = "158161905+Mialy333@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "ollama>=0.6.3",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "pdfplumber>=0.11.10",
    "python-dotenv>=1.2.4",
    "scikit-learn>=1.9.1",
    "strands-agents>=1.61.1",
